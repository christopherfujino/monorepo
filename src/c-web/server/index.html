<html>
  <head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sakura.css/css/sakura.css" type="text/css"></link>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      .topbar {
        position: absolute;
        top: 0px;
        left: 0px;
      }
      .container {
        width: 100%;
        height: 100%;
      }
      #editor {
        width: 100%;
        height: 100vh;
        resize: none;
        overflow: hidden;
        box-sizing: border-box;
        margin: 0rem;
      }
    </style>
  </head>
  <body>
    <form class="container">
      <textarea id="editor"></textarea>
      <select name="flooboo" class="topbar">
        <option value="C89">C89</option>
        <option value="C99">C99</option>
        <option value="C11">C11</option>
        <option value="C23">C23</option>
      </select>
    </form>
  </body>
</html>
