on:
  push:
    branches: ['*']

jobs:
  compile-all:
    name: compile every project
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: bootstrap checkout
        run: |
          apt-get update
          apt-get upgrade --yes
          apt-get install --yes git
      - name: checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: install deps
        shell: bash
        run: |
          set -euxo pipefail
          ./tool/fetch-github-like-deps.sh
          ./tool/fetch-deps.sh

          CLANG_VERSION=21
          CLANG=clang-$CLANG_VERSION
          update-alternatives --install /usr/bin/clang clang "$(which "$CLANG")" 100
          update-alternatives --install /usr/bin/clang++ clang++ "$(which "clang++-${CLANG_VERSION}")" 100
      - name: setup OCaml
        run: ./tool/setup-ocaml.sh
      - name: build
        run: |
          export PATH="$PATH:$PWD/bin"
          ./tool/build-all.sh
