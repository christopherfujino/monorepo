on:
  push:
    branches: ['*']

jobs:
  compile-all:
    name: compile every project
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: bootstrap checkout
        run: ./tool/fetch-github-like-deps.sh
      - name: checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: install deps
        run: ./tool/fetch-deps.sh
      - name: setup OCaml
        run: ./tool/setup-ocaml.sh
      - name: build
        run: ./tool/build-all.sh
